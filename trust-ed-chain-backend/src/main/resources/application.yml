spring:
  datasource:
    url: jdbc:h2:mem:trustedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  security:
    jwt-secret: "super-secret-change-me"
    jwt-expiration-minutes: 120

server:
  port: 8080
